# Solo pruebas. Se suma a src/main/resources/application.properties.
# INIT es provisional hasta que existan las migraciones de Flyway: crea los esquemas antes que Hibernate las tablas.
spring.datasource.url=jdbc:h2:mem:caj;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;LOCK_TIMEOUT=3000;\
INIT=CREATE SCHEMA IF NOT EXISTS cuentas\\;CREATE SCHEMA IF NOT EXISTS retiros\\;CREATE SCHEMA IF NOT EXISTS cajero

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true
